<div id="lsp_settings" class="lsp-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>🔐 世界书逐条权限 · Lore Spoilers</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label">
        <input type="checkbox" id="lsp_enabled" />
        <span>启用逐条隐藏功能</span>
      </label>
      <label class="checkbox_label">
        <input type="checkbox" id="lsp_author_mode" />
        <span>作者编辑模式（显示隐藏条目并允许修改权限）</span>
      </label>
      <p class="lsp-settings-note">
        勾选「作者编辑模式」后，打开世界书即可逐条选择「公开」或「隐藏（仅 AI 可见）」。
        取消勾选后，可预览玩家视角：隐藏条目从世界书编辑界面消失。
        AI 仍按照 SillyTavern 原本的世界书规则读取原文。
      </p>
      <p class="lsp-danger-note">
        ⚠️ 这不是加密或防提取：角色卡/世界书导出文件中仍含有隐藏条目的原文。
        玩家必须安装并启用此扩展，界面隐藏才生效；浏览器开发者工具也能读到原文。
      </p>
    </div>
  </div>
</div>
